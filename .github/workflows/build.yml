name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Build Webview APK with Cordova
      run: |
        export ANDROID_HOME=/usr/local/lib/android/sdk
        export ANDROID_SDK_ROOT=$ANDROID_HOME
        export PATH=$PATH:$ANDROID_HOME/platform-tools:$ANDROID_HOME/cmdline-tools/latest/bin

        sudo npm install -g cordova@12.0.0
        cordova create myApp com.magai.mgcinema "Mg Cinema"
        cd myApp
        cordova platform add android@13.0.0

        ICON_SRC=""
        for candidate in "../Mg_Cinema_icon_8_transparent.png" "../icon.png" "../app-icon.png" ../*.png ../*.jpg ../*.jpeg ../*.webp; do
          if [ -f "$candidate" ]; then
            ICON_SRC="$candidate"
            break
          fi
        done

        if [ -n "$ICON_SRC" ]; then
          mkdir -p res/icon/android www
          cp "$ICON_SRC" res/icon/android/icon.png
          cp "$ICON_SRC" www/app-icon.png

          for d in platforms/android/app/src/main/res/mipmap-*; do
            if [ -d "$d" ]; then
              cp "$ICON_SRC" "$d/ic_launcher.png"
              cp "$ICON_SRC" "$d/ic_launcher_round.png"
              cp "$ICON_SRC" "$d/ic_launcher_foreground.png" 2>/dev/null || true
            fi
          done

          mkdir -p platforms/android/app/src/main/res/drawable
          cp "$ICON_SRC" platforms/android/app/src/main/res/drawable/ic_launcher.png
        fi

        python3 - << 'PYEOF'
        import os, re

        with open("config.xml", "r", encoding="utf-8") as f:
            xml = f.read()

        xml = xml.replace(
            "<widget ",
            '<widget xmlns:android="http://schemas.android.com/apk/res/android" ',
            1
        )

        if "<author" in xml:
            xml = re.sub(r"<author[^>]*>.*?</author>", '<author email="dev@magai.local">Mag Ai</author>', xml, flags=re.S)
        else:
            xml = xml.replace("</widget>", '  <author email="dev@magai.local">Mag Ai</author>\n</widget>', 1)

        icon_block = ""
        if os.path.exists("res/icon/android/icon.png"):
            icon_block = """
              <platform name="android">
                <icon src="res/icon/android/icon.png" density="ldpi" />
                <icon src="res/icon/android/icon.png" density="mdpi" />
                <icon src="res/icon/android/icon.png" density="hdpi" />
                <icon src="res/icon/android/icon.png" density="xhdpi" />
                <icon src="res/icon/android/icon.png" density="xxhdpi" />
                <icon src="res/icon/android/icon.png" density="xxxhdpi" />
              </platform>
            """

        extras = f"""
          <access origin="*" />
          <allow-navigation href="*" />
          <preference name="AndroidInsecureFileModeEnabled" value="true" />
          <preference name="android-minSdkVersion" value="21" />
          <preference name="KeepRunning" value="true" />
          <preference name="Orientation" value="default" />
          {icon_block}
          <edit-config file="app/src/main/AndroidManifest.xml" mode="merge" target="/manifest/application">
            <application android:usesCleartextTraffic="true" android:hardwareAccelerated="true" android:icon="@mipmap/ic_launcher" android:roundIcon="@mipmap/ic_launcher_round" />
          </edit-config>
        </widget>"""

        xml = xml.replace("</widget>", extras, 1)
        with open("config.xml", "w", encoding="utf-8") as f:
            f.write(xml)
        PYEOF

        python3 - << 'PYEOF'
        html = """<!DOCTYPE html>
        <html lang="ar" dir="rtl" data-theme="dark">
        <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
          <title>Mg Cinema — Mag Ai</title>
          <style>
            :root {
              --accent: #e50914;
              --accent-glow: rgba(229, 9, 20, 0.35);
              --bg: #0a0a0e;
              --bg-elevated: #14141c;
              --bg-card: #1a1a24;
              --glass: rgba(20, 20, 28, 0.88);
              --text: #f5f5f7;
              --text-muted: #9a9aa6;
              --border: rgba(255, 255, 255, 0.08);
              --shadow: 0 14px 35px rgba(0, 0, 0, 0.55);
              --radius: 16px;
            }
            [data-theme="light"] {
              --bg: #f3f4f8;
              --bg-elevated: #ffffff;
              --bg-card: #ffffff;
              --glass: rgba(255, 255, 255, 0.92);
              --text: #12131a;
              --text-muted: #5c5f6e;
              --border: rgba(0, 0, 0, 0.08);
              --shadow: 0 10px 28px rgba(15, 20, 40, 0.08);
            }
            * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif; }
            body { background: var(--bg); color: var(--text); min-height: 100vh; overflow-x: hidden; }
            .navbar {
              position: sticky; top: 0; z-index: 50;
              display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap;
              padding: 12px 16px; background: var(--glass); backdrop-filter: blur(16px);
              border-bottom: 1px solid var(--border);
            }
            .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 1.05rem; }
            .brand-logo { width: 34px; height: 34px; border-radius: 10px; object-fit: contain; background: #14141c; padding: 2px; }
            .dev-tag { font-size: 0.7rem; padding: 2px 8px; border-radius: 99px; background: rgba(229,9,20,0.16); color: #ff6b72; border: 1px solid rgba(229,9,20,0.35); }
            .server-chip {
              font-size: 0.75rem; padding: 5px 10px; border-radius: 99px;
              background: var(--bg-card); border: 1px solid var(--border); color: var(--text);
              display: flex; align-items: center; gap: 6px; cursor: pointer;
            }
            .status-led { width: 8px; height: 8px; border-radius: 50%; background: #22c55e; }
            .search-box { flex: 1; min-width: 190px; max-width: 380px; position: relative; }
            .search-box input {
              width: 100%; padding: 9px 36px 9px 14px; border-radius: 99px;
              border: 1px solid var(--border); background: var(--bg-card); color: var(--text);
              outline: none; font-size: 0.9rem;
            }
            .search-box input:focus { border-color: var(--accent); }
            .search-icon { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); opacity: 0.65; pointer-events: none; }
            .nav-actions { display: flex; align-items: center; gap: 7px; }
            .icon-btn {
              width: 38px; height: 38px; border-radius: 12px; border: 1px solid var(--border);
              background: var(--bg-card); color: var(--text); cursor: pointer;
              display: grid; place-items: center; font-size: 1.05rem;
            }

            .container { max-width: 1320px; margin: 0 auto; padding: 16px 18px 150px; }
            .hero {
              border-radius: 20px; padding: 20px; margin-bottom: 18px;
              background: linear-gradient(135deg, var(--bg-elevated) 0%, var(--bg-card) 100%);
              border: 1px solid var(--border); box-shadow: var(--shadow);
            }
            .hero h1 { font-size: 1.38rem; margin-bottom: 6px; }
            .hero p { color: var(--text-muted); font-size: 0.88rem; line-height: 1.5; margin-bottom: 12px; }
            .hero-btns { display: flex; flex-wrap: wrap; gap: 8px; }
            .btn-primary {
              padding: 9px 16px; border-radius: 12px; border: none; background: var(--accent); color: #fff;
              font-weight: 700; cursor: pointer; box-shadow: 0 6px 18px var(--accent-glow);
            }
            .btn-secondary {
              padding: 9px 14px; border-radius: 12px; border: 1px solid var(--border); background: var(--bg-elevated);
              color: var(--text); font-weight: 600; cursor: pointer;
            }

            .servers-panel {
              background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 18px;
              padding: 14px; margin-bottom: 18px;
            }
            .servers-head { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
            .server-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
            .srv-card {
              background: var(--bg-card); border: 1px solid var(--border); border-radius: 14px;
              padding: 11px; display: flex; justify-content: space-between; align-items: center; gap: 8px; cursor: pointer;
            }
            .srv-card.active { border-color: var(--accent); }
            .srv-meta small { color: var(--text-muted); display: block; margin-top: 2px; }

            .tabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 12px; }
            .tab {
              padding: 8px 15px; border-radius: 99px; border: 1px solid var(--border);
              background: var(--bg-card); color: var(--text-muted); cursor: pointer; white-space: nowrap; font-weight: 600;
            }
            .tab.active, .tab:hover { background: var(--accent); color: #fff; border-color: var(--accent); }

            .section-bar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
            .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 14px; }
            .card {
              position: relative; border-radius: var(--radius); background: var(--bg-card);
              border: 1px solid var(--border); padding: 14px; cursor: pointer;
              transition: transform 0.2s ease, border-color 0.2s ease;
            }
            .card:hover, .card:focus { transform: translateY(-3px); border-color: var(--accent); outline: none; }
            .card-thumb {
              height: 110px; border-radius: 12px; margin-bottom: 10px;
              background: rgba(255,255,255,0.03); display: grid; place-items: center; font-size: 2.1rem; position: relative; overflow: hidden;
            }
            .card-thumb img { width: 100%; height: 100%; object-fit: cover; }
            .card-type {
              position: absolute; top: 8px; left: 8px; font-size: 0.7rem; padding: 2px 8px;
              border-radius: 8px; background: rgba(0,0,0,0.7); color: #fff;
            }
            .card h3 { font-size: 0.94rem; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
            .card p { font-size: 0.8rem; color: var(--text-muted); }

            .server-frame-wrap {
              display: none; position: fixed; inset: 0; z-index: 80; background: var(--bg);
              flex-direction: column;
            }
            .server-frame-wrap.open { display: flex; }
            .frame-bar {
              display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap;
              padding: 10px 14px; background: var(--bg-elevated); border-bottom: 1px solid var(--border);
            }
            .server-frame-wrap iframe { flex: 1; width: 100%; border: none; }

            /* True full-screen frame + persistent mini bar */
            .player-shell {
              position: fixed; z-index: 9999; background: #000;
              overflow: hidden; display: none; flex-direction: column;
            }
            .player-shell.full {
              display: flex; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
              width: 100vw; height: 100vh; border-radius: 0; border: none;
            }
            .player-shell.mini {
              display: flex; left: 12px; right: 12px; bottom: 12px; width: auto; height: 84px;
              border-radius: 16px; border: 1.5px solid var(--accent); flex-direction: row; align-items: center;
              background: rgba(16, 16, 24, 0.96); backdrop-filter: blur(14px);
            }
            .player-top {
              position: absolute; top: 0; left: 0; right: 0; z-index: 10;
              display: flex; align-items: center; justify-content: space-between; gap: 8px;
              padding: 8px 12px; background: rgba(10,10,16,0.78); color: #fff; font-size: 0.84rem;
            }
            .player-shell.mini .player-top {
              position: static; flex: 1; background: transparent; padding: 6px 10px; min-width: 0;
            }
            .player-controls { display: flex; align-items: center; gap: 5px; flex-wrap: nowrap; }
            .player-controls button, .player-controls select {
              background: rgba(255,255,255,0.16); border: 1px solid rgba(255,255,255,0.18); color: #fff;
              padding: 5px 8px; border-radius: 8px; cursor: pointer; font-size: 0.78rem; outline: none;
            }
            .player-controls select option { background: #14141c; color: #fff; }
            .player-body {
              width: 100%; height: 100%; flex: 1; display: flex; flex-direction: column;
              justify-content: center; align-items: center; background: #000; position: relative;
            }
            .player-shell.mini .player-body { flex: 0 0 116px; width: 116px; height: 100%; border-radius: 12px; overflow: hidden; margin-right: 8px; }
            .player-shell video { width: 100%; height: 100%; max-width: 100vw; max-height: 100vh; object-fit: contain; background: #000; }
            .player-shell.mini video { object-fit: cover; }
            .audio-stage { display: none; width: 100%; padding: 18px; text-align: center; color: #fff; }
            .player-shell.audio-mode .audio-stage { display: block; }
            .player-shell.audio-mode video { display: none; }
            .player-shell.mini.audio-mode .player-body { width: 54px; flex: 0 0 54px; background: rgba(229,9,20,0.18); }
            .player-shell.mini.audio-mode .audio-stage { padding: 4px; }
            .player-shell.mini.audio-mode .audio-title, .player-shell.mini.audio-mode audio { display: none; }

            .modal-backdrop {
              display: none; position: fixed; inset: 0; z-index: 110;
              background: rgba(0,0,0,0.65); backdrop-filter: blur(8px);
              place-items: center; padding: 16px;
            }
            .modal-backdrop.open { display: grid; }
            .modal {
              width: 100%; max-width: 470px; background: var(--bg-elevated);
              border: 1px solid var(--border); border-radius: 22px; padding: 20px; box-shadow: var(--shadow);
              max-height: 90vh; overflow-y: auto;
            }
            .modal h2 { margin-bottom: 12px; font-size: 1.15rem; display: flex; justify-content: space-between; align-items: center; }
            .setting-row { padding: 10px 0; border-bottom: 1px solid var(--border); display: flex; flex-direction: column; gap: 8px; }
            .setting-row:last-child { border-bottom: none; }
            .input-field {
              width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--border);
              background: var(--bg-card); color: var(--text); outline: none;
            }
            .lock-screen {
              position: fixed; inset: 0; z-index: 200; background: var(--bg);
              display: none; place-items: center; padding: 20px;
            }
            .lock-screen.active { display: grid; }
            .lock-card {
              width: 100%; max-width: 340px; text-align: center; background: var(--bg-elevated);
              border: 1px solid var(--border); border-radius: 24px; padding: 26px; box-shadow: var(--shadow);
            }
            .pin-dots { display: flex; justify-content: center; gap: 12px; margin: 16px 0; }
            .pin-dots span { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--accent); }
            .pin-dots span.filled { background: var(--accent); }
            .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
            .keypad button {
              padding: 13px; border-radius: 14px; border: 1px solid var(--border);
              background: var(--bg-card); color: var(--text); font-size: 1.1rem; font-weight: 700; cursor: pointer;
            }
          </style>
        </head>
        <body>
          <div class="lock-screen" id="lockScreen">
            <div class="lock-card">
              <div style="font-size:2rem;margin-bottom:8px;">&#128274;</div>
              <h3>أدخل رمز الدخول</h3>
              <p style="color:var(--text-muted);font-size:0.85rem;margin-top:4px;" id="pinHint">الرمز الافتراضي: 1234</p>
              <div class="pin-dots" id="pinDots"><span></span><span></span><span></span><span></span></div>
              <div class="keypad" id="keypad"></div>
            </div>
          </div>

          <header class="navbar">
            <div class="brand">
              <img class="brand-logo" src="app-icon.png" onerror="this.style.display='none'" alt="Mg Cinema">
              <span>Mg Cinema</span>
              <span class="dev-tag">Mag Ai</span>
              <button class="server-chip" id="activeServerChip" onclick="scanLocalServers()">
                <span class="status-led"></span>
                <span id="activeServerLabel">Galaxy Note 3 Server (192.168.1.200:8080)</span>
              </button>
            </div>
            <div class="search-box">
              <span class="search-icon">&#128269;</span>
              <input type="text" id="searchInput" placeholder="ابحث في المجلدات، الفيديو، الصوتيات...">
            </div>
            <div class="nav-actions">
              <button class="icon-btn" id="themeToggle" title="تبديل الفاتح / الداكن">&#127763;</button>
              <button class="icon-btn" id="openServerBtn" title="فتح صفحة السيرفر الكاملة">&#127760;</button>
              <button class="icon-btn" id="settingsBtn" title="الإعدادات والقفل">&#9881;</button>
            </div>
          </header>

          <main class="container">
            <section class="hero">
              <h1>مكتبة الوسائط — Mg Cinema</h1>
              <p>المطور: <strong>Mag Ai</strong> — استعرض المجلدات وشغّل الفيديو والصوت بملء الإطار مع تسريع ونافذة مصغرة مستمرة أثناء التصفح.</p>
              <div class="hero-btns">
                <button class="btn-primary" onclick="loadServerDirectory('')">&#9654; تحديث ملفات ومجلدات السيرفر</button>
                <button class="btn-secondary" onclick="scanLocalServers()">&#128225; البحث عن السيرفرات المتصلة</button>
                <button class="btn-secondary" onclick="openServerModal('')">&#127760; عرض صفحة الويب</button>
              </div>
            </section>

            <section class="servers-panel">
              <div class="servers-head">
                <div>
                  <strong>&#128246; السيرفرات والأجهزة المتصلة</strong>
                  <span style="color:var(--text-muted);font-size:0.82rem;margin-right:8px;" id="scanStatus">جاهز للفحص أو الاختيار</span>
                </div>
                <div style="display:flex;gap:8px;">
                  <button class="btn-secondary" style="padding:7px 12px;" onclick="scanLocalServers()">بحث تلقائي</button>
                  <button class="btn-primary" style="padding:7px 12px;" onclick="addManualServerPrompt()">+ إضافة جهاز/IP</button>
                </div>
              </div>
              <div class="server-list" id="serverList"></div>
            </section>

            <div class="tabs" id="categoryTabs">
              <button class="tab active" data-cat="all">الكل</button>
              <button class="tab" data-cat="folder">المجلدات</button>
              <button class="tab" data-cat="video">فيديو</button>
              <button class="tab" data-cat="audio">موسيقى وصوتيات</button>
            </div>

            <div class="section-bar">
              <div>
                <strong id="currentDirLabel">المسار الحالي: /</strong>
                <span style="color:var(--text-muted);font-size:0.82rem;margin-right:8px;" id="libraryStatus"></span>
              </div>
              <button class="btn-secondary" id="backDirBtn" style="display:none;padding:6px 12px;" onclick="goParentDir()">⬅ مجلد سابق</button>
            </div>

            <div class="grid" id="mediaGrid"></div>
          </main>

          <div class="server-frame-wrap" id="serverFrameWrap">
            <div class="frame-bar">
              <strong id="frameTitle">&#128225; صفحة السيرفر</strong>
              <div style="display:flex;gap:8px;">
                <button class="btn-secondary" style="padding:6px 12px;" onclick="reloadServerFrame()">تحديث</button>
                <button class="btn-primary" style="padding:6px 14px;" onclick="closeServerModal()">رجوع &#10005;</button>
              </div>
            </div>
            <iframe id="serverIframe" src="about:blank" allow="autoplay; fullscreen"></iframe>
          </div>

          <div class="player-shell" id="playerShell">
            <div class="player-body">
              <video id="videoPlayer" controls playsinline></video>
              <div class="audio-stage" id="audioStage">
                <div style="font-size:2rem;margin-bottom:4px;">&#127925;</div>
                <div class="audio-title" id="audioNowPlaying" style="font-weight:700;margin-bottom:6px;">تشغيل صوتي</div>
                <audio id="audioPlayer" controls style="width:100%;max-width:520px;"></audio>
              </div>
            </div>
            <div class="player-top">
              <span id="playerTitle" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:130px;">المشغل</span>
              <div class="player-controls">
                <button id="playPauseMiniBtn" onclick="togglePlayPause()" title="تشغيل / إيقاف مؤقت">⏯</button>
                <select id="speedSelect" title="سرعة التشغيل" onchange="setPlaybackSpeed(this.value)">
                  <option value="0.5">0.5x</option>
                  <option value="0.75">0.75x</option>
                  <option value="1" selected>1x</option>
                  <option value="1.25">1.25x</option>
                  <option value="1.5">1.5x</option>
                  <option value="2">2x</option>
                </select>
                <button id="toggleMiniBtn" onclick="toggleMiniPlayer()">تصغير/تكبير</button>
                <button onclick="closePlayer()">&#10005;</button>
              </div>
            </div>
          </div>

          <div class="modal-backdrop" id="settingsModal">
            <div class="modal">
              <h2>
                <span>&#9881; إعدادات الجهاز والسيرفر</span>
                <button class="icon-btn" style="width:32px;height:32px;" onclick="closeSettings()">&#10005;</button>
              </h2>
              <div class="setting-row">
                <label><strong>&#128241; اسم الجهاز الباث:</strong></label>
                <input type="text" class="input-field" id="deviceNameInput" placeholder="مثال: Galaxy Note 3">
              </div>
              <div class="setting-row">
                <label><strong>&#127760; رابط السيرفر النشط (IP + المنفذ):</strong></label>
                <input type="text" class="input-field" id="serverUrlInput" value="http://192.168.1.200:8080">
              </div>
              <div class="setting-row">
                <label style="display:flex;align-items:center;justify-content:space-between;">
                  <strong>&#128274; قفل التطبيق بكلمة سر (PIN):</strong>
                  <input type="checkbox" id="pinEnabledToggle" style="width:20px;height:20px;">
                </label>
                <input type="password" maxlength="4" class="input-field" id="newPinInput" placeholder="رمز جديد من 4 أرقام (الافتراضي 1234)">
                <button class="btn-primary" onclick="saveSettings()">حفظ وتحميل المكتبة</button>
              </div>
            </div>
          </div>

          <script>
            const DEFAULT_URL = 'http://192.168.1.200:8080';
            if (!localStorage.getItem('appPin')) localStorage.setItem('appPin', '1234');

            let servers = JSON.parse(localStorage.getItem('serversList') || 'null') || [
              { id: 'note3', name: 'Galaxy Note 3 Server', url: DEFAULT_URL, online: true }
            ];
            let activeServerId = localStorage.getItem('activeServerId') || servers[0].id;
            let currentDir = '';
            let currentCat = 'all';
            let libraryItems = [];

            const VIDEO_EXT_RE = /\.(mp4|mkv|webm|3gp|mov|avi)(\?|#|$)/i;
            const AUDIO_EXT_RE = /\.(mp3|m4a|wav|ogg|aac|flac)(\?|#|$)/i;

            function isAndroidTV() {
              const ua = navigator.userAgent || '';
              const tvUA = /Android TV|BRAVIA|AFT|FireTV|SmartTV|GoogleTV|TV/i.test(ua);
              const noTouchLargeScreen = window.innerWidth >= 1024 && !('ontouchstart' in window);
              return tvUA || noTouchLargeScreen;
            }
            const TV_MODE = isAndroidTV();

            function getActiveServer() {
              return servers.find(s => s.id === activeServerId) || servers[0] || { name: 'Server', url: DEFAULT_URL, online: true };
            }

            function saveServers() {
              localStorage.setItem('serversList', JSON.stringify(servers));
              localStorage.setItem('activeServerId', activeServerId);
              const srv = getActiveServer();
              localStorage.setItem('serverUrl', srv.url);
              document.getElementById('activeServerLabel').textContent = `${srv.name} (${srv.url.replace(/^https?:\/\//, '')})`;
              document.getElementById('frameTitle').innerHTML = `&#128225; ${srv.name}`;
              renderServers();
            }

            function renderServers() {
              const list = document.getElementById('serverList');
              list.innerHTML = '';
              servers.forEach(srv => {
                const div = document.createElement('div');
                div.className = 'srv-card' + (srv.id === activeServerId ? ' active' : '');
                div.innerHTML = `
                  <div class="srv-meta">
                    <strong>${srv.online ? '🟢' : '⚪'} ${srv.name}</strong>
                    <small>${srv.url}</small>
                  </div>
                  <span style="font-size:0.8rem;color:var(--accent);font-weight:700;">${srv.id === activeServerId ? 'محدد' : 'اختيار'}</span>
                `;
                div.onclick = () => {
                  activeServerId = srv.id;
                  saveServers();
                  loadServerDirectory('');
                };
                list.appendChild(div);
              });
            }

            function addManualServerPrompt() {
              const name = prompt('أدخل اسم الجهاز الباث:', `جهاز بث ${servers.length + 1}`);
              if (!name) return;
              const rawUrl = prompt('أدخل عنوان السيرفر (مثال: http://192.168.1.201:8080):', 'http://192.168.1.201:8080');
              if (!rawUrl) return;
              const cleanUrl = rawUrl.trim().replace(/\/+$/, '');
              const fullUrl = /^https?:\/\//i.test(cleanUrl) ? cleanUrl : 'http://' + cleanUrl;
              const id = 'srv-' + Date.now();
              servers.push({ id, name: name.trim(), url: fullUrl, online: true });
              activeServerId = id;
              saveServers();
              loadServerDirectory('');
            }

            async function probeServer(url) {
              const controller = new AbortController();
              const timer = setTimeout(() => controller.abort(), 900);
              try {
                await fetch(`${url}/?probe=${Date.now()}`, { mode: 'no-cors', signal: controller.signal });
                clearTimeout(timer);
                return true;
              } catch (_) {
                clearTimeout(timer);
                return false;
              }
            }

            async function scanLocalServers() {
              const statusEl = document.getElementById('scanStatus');
              statusEl.textContent = 'جاري البحث عن السيرفرات المتصلة...';
              const currentUrl = getActiveServer().url;
              const match = currentUrl.match(/^(https?:\/\/)(\d+\.\d+\.\d+)\.(\d+)(:\d+)?/i);
              const candidates = servers.map(s => ({ name: s.name, url: s.url }));

              if (match) {
                const proto = match[1];
                const subnet = match[2];
                const port = match[4] || ':8080';
                [1, 2, 10, 20, 50, 100, 101, 102, 150, 200, 201, 202, 254].forEach(h => {
                  const u = `${proto}${subnet}.${h}${port}`;
                  if (!candidates.some(c => c.url === u)) candidates.push({ name: `جهاز (${subnet}.${h})`, url: u });
                });
              }

              for (const c of candidates) {
                const ok = await probeServer(c.url);
                const found = servers.find(s => s.url === c.url);
                if (ok) {
                  if (found) found.online = true;
                  else servers.push({ id: 'scan-' + c.url, name: c.name, url: c.url, online: true });
                } else if (found && found.url !== DEFAULT_URL) {
                  found.online = false;
                }
              }
              saveServers();
              statusEl.textContent = `تم الفحص — الأجهزة النشطة: ${servers.filter(s => s.online).length}`;
              loadServerDirectory(currentDir);
            }

            function resolveMediaUrl(baseUrl, rawSrc) {
              if (!rawSrc) return '';
              if (/^https?:\/\//i.test(rawSrc)) return rawSrc;
              return baseUrl.replace(/\/+$/, '') + '/' + rawSrc.replace(/^\/+/, '');
            }

            async function loadServerDirectory(dir = '') {
              currentDir = dir;
              const base = getActiveServer().url.replace(/\/+$/, '');
              const statusEl = document.getElementById('libraryStatus');
              const dirLabel = document.getElementById('currentDirLabel');
              const backBtn = document.getElementById('backDirBtn');

              dirLabel.textContent = 'المسار الحالي: /' + (currentDir || '');
              backBtn.style.display = currentDir ? 'inline-block' : 'none';
              statusEl.textContent = 'جاري تحديث الملفات والمجلدات...';

              if (!TV_MODE && isMediaActive() && playerShell.classList.contains('full')) {
                setMiniMode(true);
              }

              const endpoint = currentDir ? `${base}/index.php?dir=${encodeURIComponent(currentDir)}` : `${base}/index.php`;

              try {
                const res = await fetch(endpoint, { cache: 'no-store' });
                const htmlText = await res.text();
                const parser = new DOMParser();
                const doc = parser.parseFromString(htmlText, 'text/html');
                const parsed = [];
                const seenUrls = new Set();

                doc.querySelectorAll('a[href*="dir="]').forEach(a => {
                  const href = a.getAttribute('href') || '';
                  const match = href.match(/[?&]dir=([^&]+)/);
                  if (!match) return;
                  const targetDir = decodeURIComponent(match[1].replace(/\+/g, ' '));
                  if (targetDir === currentDir) return;
                  const title = (a.textContent || targetDir).replace('📁', '').trim() || targetDir.split('/').pop();
                  const thumbImg = a.querySelector('img');
                  const thumbSrc = thumbImg ? resolveMediaUrl(base, thumbImg.getAttribute('src')) : '';
                  const key = 'folder:' + targetDir;
                  if (!seenUrls.has(key)) {
                    seenUrls.add(key);
                    parsed.push({ type: 'folder', title, dirPath: targetDir, thumb: thumbSrc, badge: 'مجلد' });
                  }
                });

                doc.querySelectorAll('video').forEach(vid => {
                  const srcEl = vid.querySelector('source');
                  const rawSrc = (srcEl && srcEl.getAttribute('src')) || vid.getAttribute('src') || '';
                  if (!rawSrc) return;
                  const fullUrl = resolveMediaUrl(base, rawSrc);
                  if (seenUrls.has(fullUrl)) return;
                  seenUrls.add(fullUrl);
                  const card = vid.closest('.card') || vid.parentElement;
                  const h3 = card ? card.querySelector('h3') : null;
                  const title = (h3 ? h3.textContent : decodeURIComponent(rawSrc.split('/').pop())).trim();
                  parsed.push({ type: 'video', title, url: fullUrl, badge: 'فيديو' });
                });

                doc.querySelectorAll('audio').forEach(aud => {
                  const srcEl = aud.querySelector('source');
                  const rawSrc = (srcEl && srcEl.getAttribute('src')) || aud.getAttribute('src') || '';
                  if (!rawSrc) return;
                  const fullUrl = resolveMediaUrl(base, rawSrc);
                  if (seenUrls.has(fullUrl)) return;
                  seenUrls.add(fullUrl);
                  const card = aud.closest('.card') || aud.parentElement;
                  const h3 = card ? card.querySelector('h3') : null;
                  const title = (h3 ? h3.textContent : decodeURIComponent(rawSrc.split('/').pop())).trim();
                  parsed.push({ type: 'audio', title, url: fullUrl, badge: 'صوت' });
                });

                // Also detect direct audio/video links in HTML
                doc.querySelectorAll('a[href]').forEach(a => {
                  const href = a.getAttribute('href') || '';
                  if (href.includes('dir=')) return;
                  const fullUrl = resolveMediaUrl(base, href);
                  if (seenUrls.has(fullUrl)) return;
                  if (AUDIO_EXT_RE.test(href)) {
                    seenUrls.add(fullUrl);
                    parsed.push({ type: 'audio', title: (a.textContent || decodeURIComponent(href.split('/').pop())).trim(), url: fullUrl, badge: 'صوت' });
                  } else if (VIDEO_EXT_RE.test(href)) {
                    seenUrls.add(fullUrl);
                    parsed.push({ type: 'video', title: (a.textContent || decodeURIComponent(href.split('/').pop())).trim(), url: fullUrl, badge: 'فيديو' });
                  }
                });

                libraryItems = parsed;
                updateCategoryCounts();
                renderMediaGrid();
              } catch (err) {
                libraryItems = [];
                updateCategoryCounts();
                statusEl.textContent = 'تعذر قراءة الملفات تلقائياً (تأكد من تشغيل السيرفر والاتصال بنفس الشبكة)';
                renderMediaGrid();
              }
            }

            function updateCategoryCounts() {
              const allCount = libraryItems.length;
              const folderCount = libraryItems.filter(i => i.type === 'folder').length;
              const videoCount = libraryItems.filter(i => i.type === 'video').length;
              const audioCount = libraryItems.filter(i => i.type === 'audio').length;

              document.querySelector('.tab[data-cat="all"]').textContent = `الكل (${allCount})`;
              document.querySelector('.tab[data-cat="folder"]').textContent = `المجلدات (${folderCount})`;
              document.querySelector('.tab[data-cat="video"]').textContent = `فيديو (${videoCount})`;
              document.querySelector('.tab[data-cat="audio"]').textContent = `موسيقى وصوتيات (${audioCount})`;
            }

            function goParentDir() {
              if (!currentDir) return;
              const parts = currentDir.split('/').filter(Boolean);
              parts.pop();
              loadServerDirectory(parts.join('/'));
            }

            function renderMediaGrid() {
              const q = document.getElementById('searchInput').value.trim().toLowerCase();
              const grid = document.getElementById('mediaGrid');
              const statusEl = document.getElementById('libraryStatus');
              grid.innerHTML = '';

              const filtered = libraryItems.filter(item => {
                const matchCat = currentCat === 'all' || item.type === currentCat;
                const matchQ = !q || item.title.toLowerCase().includes(q);
                return matchCat && matchQ;
              });

              statusEl.textContent = `المعروض: ${filtered.length} من ${libraryItems.length}`;

              if (filtered.length === 0) {
                grid.innerHTML = `
                  <div class="card" style="grid-column:1/-1;text-align:center;cursor:default;">
                    <h3>لا توجد عناصر مطابقة في هذا القسم أو المسار</h3>
                    <p>جرّب تبويب "الكل" أو اضغط "عرض صفحة الويب"</p>
                  </div>`;
                return;
              }

              filtered.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card';
                card.tabIndex = 0;

                let thumbContent = '🎬';
                if (item.type === 'folder') {
                  thumbContent = item.thumb ? `<img src="${item.thumb}" alt="folder">` : '📁';
                } else if (item.type === 'audio') {
                  thumbContent = '🎵';
                }

                card.innerHTML = `
                  <div class="card-thumb">
                    <span class="card-type">${item.badge}</span>
                    <span>${thumbContent}</span>
                  </div>
                  <h3>${item.title}</h3>
                  <p>${item.type === 'folder' ? 'فتح المجلد' : (item.type === 'audio' ? 'تشغيل صوتي' : 'تشغيل فيديو')}</p>
                `;

                card.onclick = () => {
                  if (item.type === 'folder') loadServerDirectory(item.dirPath);
                  else playMedia(item.url, item.title, item.type);
                };
                grid.appendChild(card);
              });
            }

            document.getElementById('searchInput').oninput = renderMediaGrid;
            document.querySelectorAll('.tab').forEach(btn => {
              btn.onclick = () => {
                document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentCat = btn.dataset.cat;
                renderMediaGrid();
              };
            });

            document.getElementById('themeToggle').onclick = () => {
              const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
              document.documentElement.setAttribute('data-theme', next);
              localStorage.setItem('theme', next);
            };

            function openServerModal(subPath = '') {
              const base = getActiveServer().url.replace(/\/+$/, '');
              document.getElementById('serverIframe').src = base + (subPath ? '/' + subPath.replace(/^\/+/, '') : '');
              document.getElementById('serverFrameWrap').classList.add('open');
              if (!TV_MODE && isMediaActive() && playerShell.classList.contains('full')) {
                setMiniMode(true);
              }
            }

            function reloadServerFrame() {
              const frame = document.getElementById('serverIframe');
              frame.src = frame.src && frame.src !== 'about:blank' ? frame.src : getActiveServer().url;
            }

            function closeServerModal() {
              document.getElementById('serverFrameWrap').classList.remove('open');
              if (!TV_MODE && isMediaActive() && playerShell.classList.contains('full')) {
                setMiniMode(true);
              }
            }

            document.getElementById('openServerBtn').onclick = () => openServerModal('');

            const playerShell = document.getElementById('playerShell');
            const videoPlayer = document.getElementById('videoPlayer');
            const audioPlayer = document.getElementById('audioPlayer');
            const toggleMiniBtn = document.getElementById('toggleMiniBtn');
            let activeMediaType = 'video';

            if (TV_MODE && toggleMiniBtn) toggleMiniBtn.style.display = 'none';

            function getActiveEl() {
              return activeMediaType === 'audio' ? audioPlayer : videoPlayer;
            }

            function isMediaActive() {
              const el = getActiveEl();
              return !!(el && el.src && !el.ended);
            }

            function togglePlayPause() {
              const el = getActiveEl();
              if (!el || !el.src) return;
              if (el.paused) el.play().catch(() => {});
              else el.pause();
            }

            function playMedia(url, title, type = 'video') {
              activeMediaType = type;
              document.getElementById('playerTitle').textContent = title || 'المشغل';
              document.getElementById('audioNowPlaying').textContent = title || 'تشغيل صوتي';
              const rate = parseFloat(document.getElementById('speedSelect').value || '1');

              if (type === 'audio') {
                videoPlayer.pause();
                videoPlayer.removeAttribute('src');
                audioPlayer.src = url;
                audioPlayer.playbackRate = rate;
                playerShell.className = 'player-shell full audio-mode';
                audioPlayer.play().catch(() => {});
              } else {
                audioPlayer.pause();
                audioPlayer.removeAttribute('src');
                videoPlayer.src = url;
                videoPlayer.playbackRate = rate;
                playerShell.className = 'player-shell full';
                videoPlayer.play().catch(() => {});
              }
            }

            function setPlaybackSpeed(rate) {
              const r = parseFloat(rate) || 1;
              videoPlayer.playbackRate = r;
              audioPlayer.playbackRate = r;
            }

            function setMiniMode(enableMini) {
              if (TV_MODE) {
                playerShell.className = activeMediaType === 'audio' ? 'player-shell full audio-mode' : 'player-shell full';
                return;
              }
              if (enableMini && isMediaActive()) {
                playerShell.className = activeMediaType === 'audio' ? 'player-shell mini audio-mode' : 'player-shell mini';
              } else {
                playerShell.className = activeMediaType === 'audio' ? 'player-shell full audio-mode' : 'player-shell full';
              }
            }

            function toggleMiniPlayer() {
              if (TV_MODE) return;
              setMiniMode(!playerShell.classList.contains('mini'));
            }

            function closePlayer() {
              videoPlayer.pause();
              audioPlayer.pause();
              videoPlayer.removeAttribute('src');
              audioPlayer.removeAttribute('src');
              playerShell.className = 'player-shell';
            }

            document.addEventListener('backbutton', e => {
              if (playerShell.classList.contains('full')) {
                e.preventDefault();
                if (!TV_MODE && isMediaActive()) setMiniMode(true);
                else closePlayer();
              } else if (document.getElementById('serverFrameWrap').classList.contains('open')) {
                e.preventDefault();
                closeServerModal();
              } else if (document.getElementById('settingsModal').classList.contains('open')) {
                e.preventDefault();
                closeSettings();
              } else if (currentDir) {
                e.preventDefault();
                goParentDir();
              }
            }, false);

            document.addEventListener('resume', () => {
              if (activeMediaType === 'audio' && audioPlayer.src && !audioPlayer.ended && audioPlayer.paused) {
                audioPlayer.play().catch(() => {});
              }
            }, false);

            function openSettings() {
              const srv = getActiveServer();
              document.getElementById('deviceNameInput').value = srv.name;
              document.getElementById('serverUrlInput').value = srv.url;
              document.getElementById('pinEnabledToggle').checked = localStorage.getItem('pinEnabled') === 'true';
              document.getElementById('settingsModal').classList.add('open');
            }
            function closeSettings() { document.getElementById('settingsModal').classList.remove('open'); }
            document.getElementById('settingsBtn').onclick = openSettings;

            function saveSettings() {
              const devName = document.getElementById('deviceNameInput').value.trim();
              const rawUrl = document.getElementById('serverUrlInput').value.trim().replace(/\/+$/, '');
              const srv = getActiveServer();
              if (devName) srv.name = devName;
              if (rawUrl) srv.url = /^https?:\/\//i.test(rawUrl) ? rawUrl : 'http://' + rawUrl;

              localStorage.setItem('pinEnabled', document.getElementById('pinEnabledToggle').checked);
              const newPin = document.getElementById('newPinInput').value.trim();
              if (/^\d{4}$/.test(newPin)) {
                localStorage.setItem('appPin', newPin);
                document.getElementById('newPinInput').value = '';
              }
              saveServers();
              closeSettings();
              loadServerDirectory('');
            }

            let enteredPin = '';
            function initLockScreen() {
              if (localStorage.getItem('pinEnabled') !== 'true') return;
              const savedPin = localStorage.getItem('appPin') || '1234';
              const lock = document.getElementById('lockScreen');
              const pad = document.getElementById('keypad');
              lock.classList.add('active');
              pad.innerHTML = '';
              ['1','2','3','4','5','6','7','8','9','مسح','0','✓'].forEach(key => {
                const b = document.createElement('button');
                b.textContent = key;
                b.onclick = () => {
                  if (key === 'مسح') enteredPin = '';
                  else if (key !== '✓' && enteredPin.length < 4) enteredPin += key;
                  document.querySelectorAll('#pinDots span').forEach((s, i) => s.classList.toggle('filled', i < enteredPin.length));
                  if (enteredPin.length === 4) {
                    if (enteredPin === savedPin) {
                      lock.classList.remove('active');
                      enteredPin = '';
                    } else {
                      document.getElementById('pinHint').textContent = 'رمز خاطئ (الافتراضي 1234)';
                      enteredPin = '';
                      setTimeout(() => document.querySelectorAll('#pinDots span').forEach(s => s.classList.remove('filled')), 250);
                    }
                  }
                };
                pad.appendChild(b);
              });
            }

            initLockScreen();
            saveServers();
            loadServerDirectory('');
          </script>
        </body>
        </html>"""
        with open("www/index.html", "w", encoding="utf-8") as f:
            f.write(html)
        PYEOF

        cordova build android --debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: myApp/platforms/android/app/build/outputs/apk/debug/app-debug.apk

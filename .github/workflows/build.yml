name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Build Webview APK with Cordova
      run: |
        export ANDROID_HOME=/usr/local/lib/android/sdk
        export ANDROID_SDK_ROOT=$ANDROID_HOME
        export PATH=$PATH:$ANDROID_HOME/platform-tools:$ANDROID_HOME/cmdline-tools/latest/bin

        sudo npm install -g cordova@12.0.0
        cordova create myApp com.mg.cinema "Mg Cinema"
        cd myApp
        cordova platform add android@13.0.0

        ICON_FOUND=""
        for f in ../*.png ../*.jpg ../*.jpeg ../*.webp ../../*.png; do
          if [ -f "$f" ]; then
            ICON_FOUND="$f"
            break
          fi
        done

        if [ -n "$ICON_FOUND" ]; then
          mkdir -p res/icon/android
          cp "$ICON_FOUND" res/icon/android/icon.png
          cp "$ICON_FOUND" www/app-icon.png
        fi

        python3 - << 'PYEOF'
        import os

        with open("config.xml", "r", encoding="utf-8") as f:
            xml = f.read()

        xml = xml.replace(
            "<widget ",
            '<widget xmlns:android="http://schemas.android.com/apk/res/android" ',
            1
        )

        icon_block = ""
        if os.path.exists("res/icon/android/icon.png"):
            icon_block = """
              <platform name="android">
                <icon src="res/icon/android/icon.png" density="ldpi" />
                <icon src="res/icon/android/icon.png" density="mdpi" />
                <icon src="res/icon/android/icon.png" density="hdpi" />
                <icon src="res/icon/android/icon.png" density="xhdpi" />
                <icon src="res/icon/android/icon.png" density="xxhdpi" />
                <icon src="res/icon/android/icon.png" density="xxxhdpi" />
              </platform>
            """

        extras = f"""
          <access origin="*" />
          <allow-navigation href="*" />
          <preference name="AndroidInsecureFileModeEnabled" value="true" />
          <preference name="android-minSdkVersion" value="21" />
          <preference name="KeepRunning" value="true" />
          <preference name="Orientation" value="default" />
          {icon_block}
          <edit-config file="app/src/main/AndroidManifest.xml" mode="merge" target="/manifest/application">
            <application android:usesCleartextTraffic="true" android:hardwareAccelerated="true" />
          </edit-config>
        </widget>"""

        xml = xml.replace("</widget>", extras, 1)
        with open("config.xml", "w", encoding="utf-8") as f:
            f.write(xml)
        PYEOF

        python3 - << 'PYEOF'
        html = """<!DOCTYPE html>
        <html lang="ar" dir="rtl" data-theme="dark">
        <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
          <title>Mg Cinema</title>
          <style>
            :root {
              --accent: #e50914;
              --accent-glow: rgba(229, 9, 20, 0.35);
              --bg: #0a0a0e;
              --bg-elevated: #14141c;
              --bg-card: #1a1a24;
              --glass: rgba(20, 20, 28, 0.78);
              --text: #f5f5f7;
              --text-muted: #9a9aa6;
              --border: rgba(255, 255, 255, 0.08);
              --shadow: 0 14px 35px rgba(0, 0, 0, 0.55);
              --radius: 16px;
            }
            [data-theme="light"] {
              --bg: #f3f4f8;
              --bg-elevated: #ffffff;
              --bg-card: #ffffff;
              --glass: rgba(255, 255, 255, 0.85);
              --text: #12131a;
              --text-muted: #5c5f6e;
              --border: rgba(0, 0, 0, 0.08);
              --shadow: 0 10px 28px rgba(15, 20, 40, 0.08);
            }
            * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif; }
            body { background: var(--bg); color: var(--text); min-height: 100vh; overflow-x: hidden; transition: background 0.35s ease, color 0.35s ease; }
            .navbar {
              position: sticky; top: 0; z-index: 50;
              display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
              padding: 12px 18px; background: var(--glass); backdrop-filter: blur(16px);
              border-bottom: 1px solid var(--border);
            }
            .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 1.1rem; }
            .brand-logo { width: 32px; height: 32px; border-radius: 8px; object-fit: contain; background: #14141c; padding: 2px; }
            .server-chip {
              font-size: 0.76rem; padding: 5px 11px; border-radius: 99px;
              background: var(--bg-card); border: 1px solid var(--border); color: var(--text);
              display: flex; align-items: center; gap: 7px; cursor: pointer;
            }
            .server-chip:hover { border-color: var(--accent); }
            .status-led { width: 8px; height: 8px; border-radius: 50%; background: #22c55e; }
            .search-box { flex: 1; min-width: 200px; max-width: 400px; position: relative; }
            .search-box input {
              width: 100%; padding: 10px 38px 10px 14px; border-radius: 99px;
              border: 1px solid var(--border); background: var(--bg-card); color: var(--text);
              outline: none; font-size: 0.9rem;
            }
            .search-box input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); }
            .search-icon { position: absolute; right: 13px; top: 50%; transform: translateY(-50%); opacity: 0.6; pointer-events: none; }
            .nav-actions { display: flex; align-items: center; gap: 8px; }
            .icon-btn {
              width: 38px; height: 38px; border-radius: 12px; border: 1px solid var(--border);
              background: var(--bg-card); color: var(--text); cursor: pointer;
              display: grid; place-items: center; font-size: 1.05rem;
            }
            .icon-btn:hover, .icon-btn:focus { border-color: var(--accent); outline: none; }

            .container { max-width: 1320px; margin: 0 auto; padding: 18px 20px 130px; }
            .hero {
              position: relative; border-radius: 22px; padding: 24px; margin-bottom: 20px;
              background: linear-gradient(135deg, var(--bg-elevated) 0%, var(--bg-card) 100%);
              border: 1px solid var(--border); box-shadow: var(--shadow); overflow: hidden;
            }
            .hero h1 { font-size: 1.55rem; margin-bottom: 8px; }
            .hero p { color: var(--text-muted); font-size: 0.92rem; line-height: 1.5; margin-bottom: 14px; }
            .hero-btns { display: flex; flex-wrap: wrap; gap: 10px; }
            .btn-primary {
              padding: 10px 18px; border-radius: 12px; border: none; background: var(--accent); color: #fff;
              font-weight: 700; cursor: pointer; box-shadow: 0 6px 20px var(--accent-glow);
            }
            .btn-secondary {
              padding: 10px 16px; border-radius: 12px; border: 1px solid var(--border); background: var(--bg-elevated);
              color: var(--text); font-weight: 600; cursor: pointer;
            }
            .btn-secondary:hover { border-color: var(--accent); }

            /* Servers Bar */
            .servers-panel {
              background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 18px;
              padding: 16px; margin-bottom: 20px;
            }
            .servers-head { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; margin-bottom: 12px; }
            .server-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
            .srv-card {
              background: var(--bg-card); border: 1px solid var(--border); border-radius: 14px;
              padding: 12px; display: flex; justify-content: space-between; align-items: center; gap: 10px; cursor: pointer;
            }
            .srv-card.active { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-glow); }
            .srv-meta small { color: var(--text-muted); display: block; margin-top: 3px; }

            .tabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 12px; margin-bottom: 14px; }
            .tab {
              padding: 8px 16px; border-radius: 99px; border: 1px solid var(--border);
              background: var(--bg-card); color: var(--text-muted); cursor: pointer; white-space: nowrap; font-weight: 600;
            }
            .tab.active, .tab:hover { background: var(--accent); color: #fff; border-color: var(--accent); }

            .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }
            .card {
              position: relative; border-radius: var(--radius); background: var(--bg-card);
              border: 1px solid var(--border); padding: 16px; cursor: pointer; overflow: hidden;
              transition: transform 0.2s ease, border-color 0.2s ease;
            }
            .card:hover, .card:focus { transform: translateY(-4px); border-color: var(--accent); outline: none; }
            .card-thumb {
              height: 115px; border-radius: 12px; margin-bottom: 10px;
              background: rgba(255,255,255,0.03); display: grid; place-items: center; font-size: 2.2rem; position: relative;
            }
            .card-type {
              position: absolute; top: 8px; left: 8px; font-size: 0.7rem; padding: 3px 8px;
              border-radius: 8px; background: rgba(0,0,0,0.65); color: #fff;
            }
            .fav-btn {
              position: absolute; top: 8px; right: 8px; width: 28px; height: 28px; border-radius: 50%;
              border: none; background: rgba(0,0,0,0.55); color: #fff; cursor: pointer;
            }
            .card h3 { font-size: 0.98rem; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
            .card p { font-size: 0.82rem; color: var(--text-muted); }

            .server-frame-wrap {
              display: none; position: fixed; inset: 0; z-index: 80; background: var(--bg);
              flex-direction: column;
            }
            .server-frame-wrap.open { display: flex; }
            .frame-bar {
              display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap;
              padding: 10px 14px; background: var(--bg-elevated); border-bottom: 1px solid var(--border);
            }
            .server-frame-wrap iframe { flex: 1; width: 100%; border: none; }

            /* Persistent Player + Mini-Player */
            .player-shell {
              position: fixed; z-index: 95; background: #0b0b10; border: 1px solid var(--border);
              box-shadow: 0 20px 50px rgba(0,0,0,0.85); overflow: hidden;
              transition: all 0.25s ease; display: none; flex-direction: column;
            }
            .player-shell.full { display: flex; inset: 0; border-radius: 0; }
            .player-shell.mini {
              display: flex; bottom: 14px; left: 14px; width: 320px; height: 205px;
              border-radius: 16px; border: 2px solid var(--accent);
            }
            .player-shell.mini.audio-mode { height: 120px; width: 330px; }
            .player-top {
              display: flex; align-items: center; justify-content: space-between; gap: 8px;
              padding: 8px 12px; background: rgba(15,15,22,0.95); color: #fff; font-size: 0.84rem;
            }
            .player-controls { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }
            .player-controls button, .player-controls select {
              background: rgba(255,255,255,0.14); border: 1px solid rgba(255,255,255,0.14); color: #fff;
              padding: 4px 8px; border-radius: 8px; cursor: pointer; font-size: 0.78rem; outline: none;
            }
            .player-controls select option { background: #14141c; color: #fff; }
            .player-body { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; background: #000; }
            .player-shell video { width: 100%; height: 100%; object-fit: contain; background: #000; }
            .audio-stage { display: none; width: 100%; padding: 12px; text-align: center; color: #fff; }
            .player-shell.audio-mode .audio-stage { display: block; }
            .player-shell.audio-mode video { display: none; }
            .player-shell.mini .audio-icon { display: none; }

            .modal-backdrop {
              display: none; position: fixed; inset: 0; z-index: 110;
              background: rgba(0,0,0,0.65); backdrop-filter: blur(8px);
              place-items: center; padding: 16px;
            }
            .modal-backdrop.open { display: grid; }
            .modal {
              width: 100%; max-width: 470px; background: var(--bg-elevated);
              border: 1px solid var(--border); border-radius: 22px; padding: 20px; box-shadow: var(--shadow);
              max-height: 90vh; overflow-y: auto;
            }
            .modal h2 { margin-bottom: 12px; font-size: 1.15rem; display: flex; justify-content: space-between; align-items: center; }
            .setting-row { padding: 10px 0; border-bottom: 1px solid var(--border); display: flex; flex-direction: column; gap: 8px; }
            .setting-row:last-child { border-bottom: none; }
            .swatches { display: flex; gap: 10px; flex-wrap: wrap; }
            .swatch { width: 30px; height: 30px; border-radius: 50%; border: 2px solid #fff; cursor: pointer; }
            .input-field {
              width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--border);
              background: var(--bg-card); color: var(--text); outline: none;
            }
            .lock-screen {
              position: fixed; inset: 0; z-index: 200; background: var(--bg);
              display: none; place-items: center; padding: 20px;
            }
            .lock-screen.active { display: grid; }
            .lock-card {
              width: 100%; max-width: 340px; text-align: center; background: var(--bg-elevated);
              border: 1px solid var(--border); border-radius: 24px; padding: 26px; box-shadow: var(--shadow);
            }
            .pin-dots { display: flex; justify-content: center; gap: 12px; margin: 16px 0; }
            .pin-dots span { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--accent); }
            .pin-dots span.filled { background: var(--accent); }
            .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
            .keypad button {
              padding: 13px; border-radius: 14px; border: 1px solid var(--border);
              background: var(--bg-card); color: var(--text); font-size: 1.1rem; font-weight: 700; cursor: pointer;
            }
          </style>
        </head>
        <body>
          <div class="lock-screen" id="lockScreen">
            <div class="lock-card">
              <div style="font-size:2rem;margin-bottom:8px;">&#128274;</div>
              <h3>أدخل رمز الدخول</h3>
              <p style="color:var(--text-muted);font-size:0.85rem;margin-top:4px;" id="pinHint">الرمز الافتراضي: 1234</p>
              <div class="pin-dots" id="pinDots"><span></span><span></span><span></span><span></span></div>
              <div class="keypad" id="keypad"></div>
            </div>
          </div>

          <header class="navbar">
            <div class="brand">
              <img class="brand-logo" src="app-icon.png" onerror="this.style.display='none'" alt="Mg Cinema">
              <span>Mg Cinema</span>
              <button class="server-chip" id="activeServerChip" onclick="scanLocalServers()">
                <span class="status-led"></span>
                <span id="activeServerLabel">Note 3 Server (192.168.1.200:8080)</span>
              </button>
            </div>
            <div class="search-box">
              <span class="search-icon">&#128269;</span>
              <input type="text" id="searchInput" placeholder="ابحث في الفيديو، الموسيقى، السيرفرات...">
            </div>
            <div class="nav-actions">
              <button class="icon-btn" id="themeToggle" title="تبديل الفاتح / الداكن">&#127763;</button>
              <button class="icon-btn" id="openServerBtn" title="تصفح ملفات سيرفر الجوال مباشرة داخل التطبيق">&#127760;</button>
              <button class="icon-btn" id="settingsBtn" title="الإعدادات والألوان وكلمة السر">&#9881;</button>
            </div>
          </header>

          <main class="container">
            <section class="hero">
              <span class="hero-tag">MG CINEMA • LOCAL MULTI-SERVER</span>
              <h1>تصفح ملفات سيرفر الجوال مباشرة داخل التطبيق</h1>
              <p>ابحث عن الأجهزة المتصلة بالشبكة، اختر الجهاز الباث بالاسم، وشغّل الفيديو والصوت مع تسريع ونافذة مصغرة مستمرة عند الرجوع.</p>
              <div class="hero-btns">
                <button class="btn-primary" onclick="openServerModal('')">&#9654; تصفح ملفات سيرفر الجوال مباشرة داخل التطبيق</button>
                <button class="btn-secondary" onclick="scanLocalServers()">&#128225; البحث عن السيرفرات المتصلة</button>
                <button class="btn-secondary" onclick="openSettings()">&#127912; إعدادات الجهاز والقفل</button>
              </div>
            </section>

            <!-- Connected Servers Selector -->
            <section class="servers-panel">
              <div class="servers-head">
                <div>
                  <strong>&#128246; السيرفرات والأجهزة المتصلة</strong>
                  <span style="color:var(--text-muted);font-size:0.82rem;margin-right:8px;" id="scanStatus">اضغط بحث لفحص الشبكة المحلية</span>
                </div>
                <div style="display:flex;gap:8px;">
                  <button class="btn-secondary" style="padding:7px 12px;" onclick="scanLocalServers()">بحث تلقائي</button>
                  <button class="btn-primary" style="padding:7px 12px;" onclick="addManualServerPrompt()">+ إضافة جهاز/IP</button>
                </div>
              </div>
              <div class="server-list" id="serverList"></div>
            </section>

            <div class="tabs" id="categoryTabs">
              <button class="tab active" data-cat="all">الكل</button>
              <button class="tab" data-cat="video">فيديو</button>
              <button class="tab" data-cat="audio">موسيقى وصوتيات</button>
              <button class="tab" data-cat="fav">المفضلة &#11088;</button>
            </div>

            <div class="grid" id="mediaGrid"></div>
          </main>

          <div class="server-frame-wrap" id="serverFrameWrap">
            <div class="frame-bar">
              <strong id="frameTitle">&#128225; تصفح ملفات سيرفر الجوال مباشرة داخل التطبيق</strong>
              <div style="display:flex;gap:8px;">
                <button class="btn-secondary" style="padding:6px 12px;" onclick="reloadServerFrame()">تحديث</button>
                <button class="btn-primary" style="padding:6px 14px;" onclick="closeServerModal()">رجوع للواجهة &#10005;</button>
              </div>
            </div>
            <iframe id="serverIframe" src="about:blank" allow="autoplay; fullscreen"></iframe>
          </div>

          <div class="player-shell" id="playerShell">
            <div class="player-top">
              <span id="playerTitle" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:145px;">المشغل</span>
              <div class="player-controls">
                <select id="speedSelect" title="سرعة التشغيل" onchange="setPlaybackSpeed(this.value)">
                  <option value="0.5">0.5x</option>
                  <option value="0.75">0.75x</option>
                  <option value="1" selected>1x</option>
                  <option value="1.25">1.25x</option>
                  <option value="1.5">1.5x</option>
                  <option value="2">2x</option>
                </select>
                <button id="toggleMiniBtn" onclick="toggleMiniPlayer()">مصغرة</button>
                <button onclick="closePlayer()">&#10005;</button>
              </div>
            </div>
            <div class="player-body">
              <video id="videoPlayer" controls playsinline></video>
              <div class="audio-stage" id="audioStage">
                <div class="audio-icon" style="font-size:2.4rem;margin-bottom:6px;">&#127925;</div>
                <div id="audioNowPlaying" style="font-weight:700;margin-bottom:6px;">تشغيل صوتي</div>
                <audio id="audioPlayer" controls style="width:100%;max-width:520px;"></audio>
              </div>
            </div>
          </div>

          <div class="modal-backdrop" id="settingsModal">
            <div class="modal">
              <h2>
                <span>&#9881; إعدادات الجهاز والسيرفر</span>
                <button class="icon-btn" style="width:32px;height:32px;" onclick="closeSettings()">&#10005;</button>
              </h2>
              <div class="setting-row">
                <label><strong>&#128241; اسم هذا الجهاز (يظهر عند البث/الاتصال):</strong></label>
                <input type="text" class="input-field" id="deviceNameInput" placeholder="مثال: Galaxy Note 3">
              </div>
              <div class="setting-row">
                <label><strong>&#127760; رابط السيرفر النشط (IP + المنفذ):</strong></label>
                <input type="text" class="input-field" id="serverUrlInput" value="http://192.168.1.200:8080">
              </div>
              <div class="setting-row">
                <label><strong>&#127912; لون الهوية:</strong></label>
                <div class="swatches">
                  <div class="swatch" style="background:#e50914" onclick="setAccent('#e50914','rgba(229,9,20,0.35)')"></div>
                  <div class="swatch" style="background:#00d2ff" onclick="setAccent('#00d2ff','rgba(0,210,255,0.35)')"></div>
                  <div class="swatch" style="background:#8b5cf6" onclick="setAccent('#8b5cf6','rgba(139,92,246,0.35)')"></div>
                  <div class="swatch" style="background:#10b981" onclick="setAccent('#10b981','rgba(16,185,129,0.35)')"></div>
                  <div class="swatch" style="background:#f59e0b" onclick="setAccent('#f59e0b','rgba(245,158,11,0.35)')"></div>
                </div>
              </div>
              <div class="setting-row">
                <label style="display:flex;align-items:center;justify-content:space-between;">
                  <strong>&#128274; قفل التطبيق بكلمة سر (PIN):</strong>
                  <input type="checkbox" id="pinEnabledToggle" style="width:20px;height:20px;">
                </label>
                <input type="password" maxlength="4" class="input-field" id="newPinInput" placeholder="رمز جديد من 4 أرقام (الافتراضي 1234)">
                <button class="btn-primary" onclick="saveSettings()">حفظ الإعدادات</button>
              </div>
            </div>
          </div>

          <script>
            const DEFAULT_URL = 'http://192.168.1.200:8080';
            if (!localStorage.getItem('appPin')) localStorage.setItem('appPin', '1234');
            if (!localStorage.getItem('deviceName')) localStorage.setItem('deviceName', 'جهازي الحالي');

            let servers = JSON.parse(localStorage.getItem('serversList') || 'null') || [
              { id: 'note3', name: 'Galaxy Note 3 Server', url: DEFAULT_URL, online: true }
            ];
            let activeServerId = localStorage.getItem('activeServerId') || servers[0].id;
            let favs = JSON.parse(localStorage.getItem('favs') || '[]');
            let currentCat = 'all';

            function isAndroidTV() {
              const ua = navigator.userAgent || '';
              const tvUA = /Android TV|BRAVIA|AFT|FireTV|SmartTV|GoogleTV|TV/i.test(ua);
              const noTouchLargeScreen = window.innerWidth >= 1024 && !('ontouchstart' in window);
              return tvUA || noTouchLargeScreen;
            }
            const TV_MODE = isAndroidTV();

            function getActiveServer() {
              return servers.find(s => s.id === activeServerId) || servers[0] || { name: 'Server', url: DEFAULT_URL, online: true };
            }

            function saveServers() {
              localStorage.setItem('serversList', JSON.stringify(servers));
              localStorage.setItem('activeServerId', activeServerId);
              const srv = getActiveServer();
              localStorage.setItem('serverUrl', srv.url);
              document.getElementById('activeServerLabel').textContent = `${srv.name} (${srv.url.replace(/^https?:\/\//, '')})`;
              document.getElementById('frameTitle').innerHTML = `&#128225; ${srv.name} — تصفح ملفات سيرفر الجوال مباشرة داخل التطبيق`;
              renderServers();
            }

            function renderServers() {
              const list = document.getElementById('serverList');
              list.innerHTML = '';
              servers.forEach(srv => {
                const div = document.createElement('div');
                div.className = 'srv-card' + (srv.id === activeServerId ? ' active' : '');
                div.innerHTML = `
                  <div class="srv-meta">
                    <strong>${srv.online ? '🟢' : '⚪'} ${srv.name}</strong>
                    <small>${srv.url}</small>
                  </div>
                  <span style="font-size:0.8rem;color:var(--accent);font-weight:700;">${srv.id === activeServerId ? 'محدد' : 'اختيار'}</span>
                `;
                div.onclick = () => {
                  activeServerId = srv.id;
                  saveServers();
                };
                list.appendChild(div);
              });
            }

            function addManualServerPrompt() {
              const name = prompt('أدخل اسم الجهاز الباث (مثال: جوال 2):', `جهاز بث ${servers.length + 1}`);
              if (!name) return;
              const rawUrl = prompt('أدخل عنوان السيرفر (مثال: http://192.168.1.201:8080):', 'http://192.168.1.201:8080');
              if (!rawUrl) return;
              const cleanUrl = rawUrl.trim().replace(/\/+$/, '');
              const fullUrl = /^https?:\/\//i.test(cleanUrl) ? cleanUrl : 'http://' + cleanUrl;
              const id = 'srv-' + Date.now();
              servers.push({ id, name: name.trim(), url: fullUrl, online: true });
              activeServerId = id;
              saveServers();
            }

            async function probeServer(url) {
              const controller = new AbortController();
              const timer = setTimeout(() => controller.abort(), 900);
              try {
                await fetch(`${url}/?probe=${Date.now()}`, { mode: 'no-cors', signal: controller.signal });
                clearTimeout(timer);
                return true;
              } catch (_) {
                clearTimeout(timer);
                return false;
              }
            }

            async function scanLocalServers() {
              const statusEl = document.getElementById('scanStatus');
              statusEl.textContent = 'جاري البحث عن السيرفرات المتصلة في الشبكة...';

              const currentUrl = getActiveServer().url;
              const match = currentUrl.match(/^(https?:\/\/)(\d+\.\d+\.\d+)\.(\d+)(:\d+)?/i);
              const candidates = [];

              // Always probe saved servers first
              servers.forEach(s => candidates.push({ name: s.name, url: s.url, existingId: s.id }));

              if (match) {
                const proto = match[1];
                const subnet = match[2];
                const port = match[4] || ':8080';
                const commonHosts = [1, 2, 10, 20, 50, 100, 101, 102, 150, 200, 201, 202, 254];
                commonHosts.forEach(h => {
                  const candidateUrl = `${proto}${subnet}.${h}${port}`;
                  if (!candidates.some(c => c.url === candidateUrl)) {
                    candidates.push({ name: `جهاز (${subnet}.${h})`, url: candidateUrl, existingId: null });
                  }
                });
              }

              for (const c of candidates) {
                const ok = await probeServer(c.url);
                if (ok) {
                  const found = servers.find(s => s.url === c.url);
                  if (found) {
                    found.online = true;
                  } else {
                    servers.push({ id: 'scan-' + c.url, name: c.name, url: c.url, online: true });
                  }
                } else {
                  const found = servers.find(s => s.url === c.url);
                  if (found && found.url !== DEFAULT_URL) found.online = false;
                }
              }

              saveServers();
              const onlineCount = servers.filter(s => s.online).length;
              statusEl.textContent = `تم الفحص — الأجهزة النشطة: ${onlineCount}`;
            }

            const items = [
              { id: 'srv-root', title: 'تصفح ملفات سيرفر الجوال مباشرة داخل التطبيق', desc: 'استعراض جميع المجلدات والملفات على السيرفر المختار', type: 'video', icon: '&#128194;', url: '' },
              { id: 'srv-video', title: 'مكتبة الفيديو', desc: 'مشاهدة الفيديو مع تسريع ونافذة مصغرة عند الرجوع', type: 'video', icon: '&#127916;', url: '/video' },
              { id: 'srv-music', title: 'الموسيقى والصوتيات', desc: 'استمرار الصوت عند الرجوع وعند قفل الشاشة', type: 'audio', icon: '&#127925;', url: '/music' }
            ];

            const savedTheme = localStorage.getItem('theme') || 'dark';
            document.documentElement.setAttribute('data-theme', savedTheme);
            const savedAccent = localStorage.getItem('accent');
            const savedGlow = localStorage.getItem('accentGlow');
            if (savedAccent) {
              document.documentElement.style.setProperty('--accent', savedAccent);
              document.documentElement.style.setProperty('--accent-glow', savedGlow);
            }

            document.getElementById('themeToggle').onclick = () => {
              const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
              document.documentElement.setAttribute('data-theme', next);
              localStorage.setItem('theme', next);
            };

            function setAccent(color, glow) {
              document.documentElement.style.setProperty('--accent', color);
              document.documentElement.style.setProperty('--accent-glow', glow);
              localStorage.setItem('accent', color);
              localStorage.setItem('accentGlow', glow);
            }

            function renderGrid() {
              const q = document.getElementById('searchInput').value.trim().toLowerCase();
              const grid = document.getElementById('mediaGrid');
              grid.innerHTML = '';
              items.filter(item => {
                const matchCat = currentCat === 'all' || (currentCat === 'fav' ? favs.includes(item.id) : item.type === currentCat);
                const matchQ = !q || item.title.toLowerCase().includes(q) || item.desc.toLowerCase().includes(q);
                return matchCat && matchQ;
              }).forEach(item => {
                const isFav = favs.includes(item.id);
                const card = document.createElement('div');
                card.className = 'card';
                card.tabIndex = 0;
                card.innerHTML = `
                  <div class="card-thumb">
                    <span class="card-type">${item.type === 'audio' ? 'صوتيات' : 'مكتبة الفيديو'}</span>
                    <button class="fav-btn" onclick="toggleFav(event, '${item.id}')">${isFav ? '&#11088;' : '&#9734;'}</button>
                    <span>${item.icon}</span>
                  </div>
                  <h3>${item.title}</h3>
                  <p>${item.desc}</p>
                `;
                card.onclick = () => openServerModal(item.url);
                grid.appendChild(card);
              });
            }

            function toggleFav(e, id) {
              e.stopPropagation();
              favs = favs.includes(id) ? favs.filter(x => x !== id) : [...favs, id];
              localStorage.setItem('favs', JSON.stringify(favs));
              renderGrid();
            }

            document.getElementById('searchInput').oninput = renderGrid;
            document.querySelectorAll('.tab').forEach(btn => {
              btn.onclick = () => {
                document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentCat = btn.dataset.cat;
                renderGrid();
              };
            });

            function openServerModal(subPath = '') {
              const base = getActiveServer().url.replace(/\/+$/, '');
              document.getElementById('serverIframe').src = base + subPath;
              document.getElementById('serverFrameWrap').classList.add('open');
            }

            function reloadServerFrame() {
              const frame = document.getElementById('serverIframe');
              const base = getActiveServer().url.replace(/\/+$/, '');
              frame.src = frame.src && frame.src !== 'about:blank' ? frame.src : base;
            }

            function closeServerModal() {
              document.getElementById('serverFrameWrap').classList.remove('open');
              if (!TV_MODE && isMediaActive() && playerShell.classList.contains('full')) {
                setMiniMode(true);
              }
            }

            document.getElementById('openServerBtn').onclick = () => openServerModal('');

            const playerShell = document.getElementById('playerShell');
            const videoPlayer = document.getElementById('videoPlayer');
            const audioPlayer = document.getElementById('audioPlayer');
            const toggleMiniBtn = document.getElementById('toggleMiniBtn');
            let activeMediaType = 'video';

            if (TV_MODE && toggleMiniBtn) {
              toggleMiniBtn.style.display = 'none';
            }

            function isMediaActive() {
              const el = activeMediaType === 'audio' ? audioPlayer : videoPlayer;
              return !!(el && el.src && !el.ended);
            }

            function playMedia(url, title, type = 'video') {
              activeMediaType = type;
              document.getElementById('playerTitle').textContent = title || 'المشغل';
              document.getElementById('audioNowPlaying').textContent = title || 'تشغيل صوتي';
              const rate = parseFloat(document.getElementById('speedSelect').value || '1');

              if (type === 'audio') {
                videoPlayer.pause();
                videoPlayer.removeAttribute('src');
                audioPlayer.src = url;
                audioPlayer.playbackRate = rate;
                playerShell.className = 'player-shell full audio-mode';
                audioPlayer.play().catch(() => {});
              } else {
                audioPlayer.pause();
                audioPlayer.removeAttribute('src');
                videoPlayer.src = url;
                videoPlayer.playbackRate = rate;
                playerShell.className = 'player-shell full';
                videoPlayer.play().catch(() => {});
              }
            }

            function setPlaybackSpeed(rate) {
              const r = parseFloat(rate) || 1;
              videoPlayer.playbackRate = r;
              audioPlayer.playbackRate = r;
            }

            function setMiniMode(enableMini) {
              if (TV_MODE) {
                playerShell.className = activeMediaType === 'audio' ? 'player-shell full audio-mode' : 'player-shell full';
                return;
              }
              if (enableMini && isMediaActive()) {
                playerShell.className = activeMediaType === 'audio' ? 'player-shell mini audio-mode' : 'player-shell mini';
                if (toggleMiniBtn) toggleMiniBtn.textContent = 'تكبير';
              } else {
                playerShell.className = activeMediaType === 'audio' ? 'player-shell full audio-mode' : 'player-shell full';
                if (toggleMiniBtn) toggleMiniBtn.textContent = 'مصغرة';
              }
            }

            function toggleMiniPlayer() {
              if (TV_MODE) return;
              setMiniMode(!playerShell.classList.contains('mini'));
            }

            function closePlayer() {
              videoPlayer.pause();
              audioPlayer.pause();
              videoPlayer.removeAttribute('src');
              audioPlayer.removeAttribute('src');
              playerShell.className = 'player-shell';
            }

            // Back button keeps media running in mini-player so user can search/browse (except Android TV)
            document.addEventListener('backbutton', e => {
              if (playerShell.classList.contains('full')) {
                e.preventDefault();
                if (!TV_MODE && isMediaActive()) {
                  setMiniMode(true);
                } else {
                  closePlayer();
                }
              } else if (document.getElementById('serverFrameWrap').classList.contains('open')) {
                e.preventDefault();
                closeServerModal();
              } else if (document.getElementById('settingsModal').classList.contains('open')) {
                e.preventDefault();
                closeSettings();
              }
            }, false);

            function openSettings() {
              const srv = getActiveServer();
              document.getElementById('deviceNameInput').value = localStorage.getItem('deviceName') || '';
              document.getElementById('serverUrlInput').value = srv.url;
              document.getElementById('pinEnabledToggle').checked = localStorage.getItem('pinEnabled') === 'true';
              document.getElementById('settingsModal').classList.add('open');
            }
            function closeSettings() { document.getElementById('settingsModal').classList.remove('open'); }
            document.getElementById('settingsBtn').onclick = openSettings;

            function saveSettings() {
              const devName = document.getElementById('deviceNameInput').value.trim();
              if (devName) localStorage.setItem('deviceName', devName);

              const rawUrl = document.getElementById('serverUrlInput').value.trim().replace(/\/+$/, '');
              if (rawUrl) {
                const fullUrl = /^https?:\/\//i.test(rawUrl) ? rawUrl : 'http://' + rawUrl;
                const srv = getActiveServer();
                srv.url = fullUrl;
                if (devName && srv.id === 'note3') srv.name = devName;
              }

              const pinEnabled = document.getElementById('pinEnabledToggle').checked;
              localStorage.setItem('pinEnabled', pinEnabled);
              const newPin = document.getElementById('newPinInput').value.trim();
              if (/^\d{4}$/.test(newPin)) {
                localStorage.setItem('appPin', newPin);
                document.getElementById('newPinInput').value = '';
              }
              saveServers();
              closeSettings();
            }

            let enteredPin = '';
            function initLockScreen() {
              if (localStorage.getItem('pinEnabled') !== 'true') return;
              const savedPin = localStorage.getItem('appPin') || '1234';
              const lock = document.getElementById('lockScreen');
              const pad = document.getElementById('keypad');
              lock.classList.add('active');
              pad.innerHTML = '';
              ['1','2','3','4','5','6','7','8','9','مسح','0','✓'].forEach(key => {
                const b = document.createElement('button');
                b.textContent = key;
                b.onclick = () => {
                  if (key === 'مسح') enteredPin = '';
                  else if (key !== '✓' && enteredPin.length < 4) enteredPin += key;
                  document.querySelectorAll('#pinDots span').forEach((s, i) => s.classList.toggle('filled', i < enteredPin.length));
                  if (enteredPin.length === 4) {
                    if (enteredPin === savedPin) {
                      lock.classList.remove('active');
                      enteredPin = '';
                    } else {
                      document.getElementById('pinHint').textContent = 'رمز خاطئ، حاول مجدداً (الافتراضي 1234)';
                      enteredPin = '';
                      setTimeout(() => document.querySelectorAll('#pinDots span').forEach(s => s.classList.remove('filled')), 250);
                    }
                  }
                };
                pad.appendChild(b);
              });
            }

            initLockScreen();
            saveServers();
            renderGrid();
          </script>
        </body>
        </html>"""
        with open("www/index.html", "w", encoding="utf-8") as f:
            f.write(html)
        PYEOF

        cordova build android --debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: myApp/platforms/android/app/build/outputs/apk/debug/app-debug.apk

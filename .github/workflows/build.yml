name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up JDK 11
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '11'

    - name: Install Cordova and Android Platform
      run: |
        sudo npm install -g cordova@11.1.0
        cordova create myApp com.note3.media MediaApp
        cd myApp
        cordova platform add android@10.1.2
        # توجيه التطبيق إلى سيرفرك المحلي
        echo '<script>window.location.replace("http://192.168.1.200:8080");</script>' > www/index.html
        cordova build android --release -- --no-sign

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v3
      with:
        name: app-release-apk
        path: myApp/platforms/android/app/build/outputs/apk/release/app-release-unsigned.apk

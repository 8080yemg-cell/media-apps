name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Build Webview APK with Cordova
      run: |
        export ANDROID_HOME=/usr/local/lib/android/sdk
        export ANDROID_SDK_ROOT=$ANDROID_HOME
        export PATH=$PATH:$ANDROID_HOME/platform-tools:$ANDROID_HOME/cmdline-tools/latest/bin

        sudo npm install -g cordova@12.0.0
        cordova create myApp com.note3.media MediaApp
        cd myApp
        cordova platform add android@13.0.0

        # السماح بالاتصال عبر HTTP المحلي وضبط الحد الأدنى لأندرويد 5 (API 21)
        node -e '
          const fs = require("fs");
          let xml = fs.readFileSync("config.xml", "utf8");
          xml = xml.replace("<widget ", "<widget xmlns:android=\"http://schemas.android.com/apk/res/android\" ");
          xml = xml.replace("</widget>", "  <preference name=\"AndroidInsecureFileModeEnabled\" value=\"true\" />\n  <preference name=\"android-minSdkVersion\" value=\"21\" />\n  <edit-config file=\"app/src/main/AndroidManifest.xml\" mode=\"merge\" target=\"/manifest/application\">\n    <application android:usesCleartextTraffic=\"true\" />\n  </edit-config>\n</widget>");
          fs.writeFileSync("config.xml", xml);
        '

        # توجيه التطبيق إلى سيرفرك المحلي على العنوان 192.168.1.200:8080
        echo '<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"></head><body style="margin:0;background:#0f0f0f;"><script>window.location.replace("http://192.168.1.200:8080");</script></body></html>' > www/index.html

        cordova build android --debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: myApp/platforms/android/app/build/outputs/apk/debug/app-debug.apk

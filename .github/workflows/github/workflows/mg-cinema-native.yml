      - name: Apply Mg Cinema App Icon
        run: |
          if [ -f "0012.png" ]; then
            for density in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
              mkdir -p "MgCinemaProject/app/src/main/res/$density"
              cp "0012.png" "MgCinemaProject/app/src/main/res/$density/ic_launcher.png"
              cp "0012.png" "MgCinemaProject/app/src/main/res/$density/ic_launcher_round.png"
              cp "0012.png" "MgCinemaProject/app/src/main/res/$density/ic_launcher_foreground.png"
            done
          fi

      - name: Build Debug APK
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          export PATH=$PATH:$ANDROID_HOME/platform-tools
          curl -fsSL https://services.gradle.org/distributions/gradle-8.7-bin.zip -o /tmp/gradle-8.7-bin.zip
          unzip -q /tmp/gradle-8.7-bin.zip -d /tmp/gradle
          cd MgCinemaProject
          /tmp/gradle/gradle-8.7/bin/gradle assembleDebug --no-daemon 2>&1 | tee build.log
          EXIT_CODE=${PIPESTATUS[0]}
          if [ $EXIT_CODE -ne 0 ]; then
            echo "=== ERROR SUMMARY ==="
            grep -E "FAILURE:|Execution failed for task|Caused by:|error:" -A 4 build.log | tail -n 60 || true
            exit $EXIT_CODE
          fi

      - name: Upload Mg Cinema APK
        uses: actions/upload-artifact@v4
        with:
          name: mg-cinema-native-apk
          path: MgCinemaProject/app/build/outputs/apk/debug/app-debug.apk

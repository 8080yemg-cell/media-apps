name: Build Native Mg Cinema APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Ensure Android SDK Packages
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          export PATH=$PATH:$ANDROID_HOME/platform-tools:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/cmdline-tools/tools/bin
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Create Native Mg Cinema Project (API 19 to 34)
        run: |
          mkdir -p MgCinemaProject/app/src/main/java/com/magai/mgcinema
          mkdir -p MgCinemaProject/app/src/main/res/layout
          mkdir -p MgCinemaProject/app/src/main/res/values
          mkdir -p MgCinemaProject/app/src/main/res/drawable
          mkdir -p MgCinemaProject/app/src/main/res/mipmap-anydpi-v26

          cat << 'EOF' > MgCinemaProject/gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=false
          EOF

          cat << 'EOF' > MgCinemaProject/settings.gradle
          rootProject.name = "MgCinema"
          include ':app'
          EOF

          cat << 'EOF' > MgCinemaProject/build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.5.2'
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF

          cat << 'EOF' > MgCinemaProject/app/build.gradle
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.magai.mgcinema'
              compileSdk 34

              defaultConfig {
                  applicationId "com.magai.mgcinema"
                  minSdk 19
                  targetSdk 34
                  versionCode 3
                  versionName "0.2"
                  multiDexEnabled true
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
                  debug {
                      minifyEnabled false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'androidx.multidex:multidex:2.0.1'
          }
          EOF

          cat << 'EOF' > MgCinemaProject/app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">Mg Cinema</string>
          </resources>
          EOF

          cat << 'EOF' > MgCinemaProject/app/src/main/res/values/colors.xml
          <resources>
              <color name="ic_launcher_bg">#090712</color>
              <color name="cinema_bg">#08070F</color>
              <color name="cinema_card">#151224</color>
              <color name="cinema_accent">#E50914</color>
              <color name="cinema_purple">#7C3AED</color>
          </resources>
          EOF

          cat << 'EOF' > MgCinemaProject/app/src/main/res/values/styles.xml
          <resources>
              <style name="AppTheme" parent="Theme.AppCompat.NoActionBar">
                  <item name="colorPrimary">#E50914</item>
                  <item name="colorPrimaryDark">#08070F</item>
                  <item name="colorAccent">#7C3AED</item>
              </style>
          </resources>
          EOF

          cat << 'EOF' > MgCinemaProject/app/src/main/res/drawable/cinema_ambient_bg.xml
          <?xml version="1.0" encoding="utf-8"?>
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
              <item>
                  <shape android:shape="rectangle">
                      <gradient
                          android:angle="315"
                          android:startColor="#07060D"
                          android:centerColor="#120C24"
                          android:endColor="#1D0916" />
                  </shape>
              </item>
              <item android:top="160dp" android:left="40dp" android:right="40dp">
                  <shape android:shape="rectangle">
                      <corners android:radius="48dp" />
                      <gradient
                          android:angle="270"
                          android:startColor="#337C3AED"
                          android:centerColor="#26E50914"
                          android:endColor="#0007060D" />
                  </shape>
              </item>
          </layer-list>
          EOF

          cat << 'EOF' > MgCinemaProject/app/src/main/res/drawable/tv_focus_item.xml
          <?xml version="1.0" encoding="utf-8"?>
          <selector xmlns:android="http://schemas.android.com/apk/res/android">
              <item android:state_focused="true">
                  <shape android:shape="rectangle">
                      <corners android:radius="14dp" />
                      <solid android:color="#23193B" />
                      <stroke android:width="2dp" android:color="#FF2A55" />
                  </shape>
              </item>
              <item android:state_pressed="true">
                  <shape android:shape="rectangle">
                      <corners android:radius="14dp" />
                      <solid android:color="#2B1324" />
                      <stroke android:width="2dp" android:color="#A855F7" />
                  </shape>
              </item>
              <item>
                  <shape android:shape="rectangle">
                      <corners android:radius="14dp" />
                      <solid android:color="#151224" />
                      <stroke android:width="1dp" android:color="#282342" />
                  </shape>
              </item>
          </selector>
          EOF

          cat << 'EOF' > MgCinemaProject/app/src/main/res/drawable/tv_focus_btn.xml
          <?xml version="1.0" encoding="utf-8"?>
          <selector xmlns:android="http://schemas.android.com/apk/res/android">
              <item android:state_focused="true">
                  <shape android:shape="rectangle">
                      <corners android:radius="12dp" />
                      <solid android:color="#E50914" />
                      <stroke android:width="2dp" android:color="#FFFFFF" />
                  </shape>
              </item>
              <item>
                  <shape android:shape="rectangle">
                      <corners android:radius="12dp" />
                      <solid android:color="#1E1833" />
                      <stroke android:width="1dp" android:color="#3A2F5E" />
                  </shape>
              </item>
          </selector>
          EOF

          cat << 'EOF' > MgCinemaProject/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_bg" />
              <foreground android:drawable="@mipmap/ic_launcher_foreground" />
          </adaptive-icon>
          EOF

          cat << 'EOF' > MgCinemaProject/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_bg" />
              <foreground android:drawable="@mipmap/ic_launcher_foreground" />
          </adaptive-icon>
          EOF

          cat << 'EOF' > MgCinemaProject/app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:tools="http://schemas.android.com/tools">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />

              <uses-feature android:name="android.software.leanback" android:required="false" />
              <uses-feature android:name="android.hardware.touchscreen" android:required="false" />

              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:banner="@mipmap/ic_launcher"
                  android:label="@string/app_name"
                  android:theme="@style/AppTheme"
                  android:usesCleartextTraffic="true">

                  <activity
                      android:name=".MainActivity"
                      android:configChanges="orientation|screenSize|keyboardHidden"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                          <category android:name="android.intent.category.LEANBACK_LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > MgCinemaProject/app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <FrameLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:id="@+id/rootFrame"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="@drawable/cinema_ambient_bg">

              <View
                  android:id="@+id/glowLayer"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  android:background="#18E50914" />

              <ScrollView
                  android:id="@+id/mainScroll"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  android:padding="16dp"
                  android:scrollbars="vertical">

                  <LinearLayout
                      android:id="@+id/mainContainer"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:orientation="vertical">

                      <LinearLayout
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:background="@drawable/tv_focus_item"
                          android:gravity="center_vertical"
                          android:orientation="horizontal"

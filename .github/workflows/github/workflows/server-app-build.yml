name: Build Mg Server APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Build Server Control App APK with Cordova
      run: |
        export ANDROID_HOME=/usr/local/lib/android/sdk
        export ANDROID_SDK_ROOT=$ANDROID_HOME
        export PATH=$PATH:$ANDROID_HOME/platform-tools:$ANDROID_HOME/cmdline-tools/latest/bin

        sudo npm install -g cordova@12.0.0
        cordova create mgServer com.magai.mgserver "Mg Server"
        cd mgServer
        cordova platform add android@13.0.0

        ICON_SRC=""
        for candidate in "../Mg_Cinema_icon_8_transparent.png" "../icon.png" "../app-icon.png" ../*.png ../*.jpg ../*.jpeg ../*.webp; do
          if [ -f "$candidate" ]; then
            ICON_SRC="$candidate"
            break
          fi
        done

        if [ -n "$ICON_SRC" ]; then
          mkdir -p res/icon/android www
          cp "$ICON_SRC" res/icon/android/icon.png
          cp "$ICON_SRC" www/app-icon.png
          for res_dir in platforms/android/app/src/main/res platforms/android/res; do
            if [ -d "$res_dir" ]; then
              for d in "$res_dir"/mipmap-* "$res_dir"/drawable*; do
                if [ -d "$d" ]; then
                  cp "$ICON_SRC" "$d/ic_launcher.png"
                  cp "$ICON_SRC" "$d/ic_launcher_round.png"
                fi
              done
            fi
          done
        fi

        python3 - << 'PYEOF'
        import os, re

        with open("config.xml", "r", encoding="utf-8") as f:
            xml = f.read()

        xml = xml.replace(
            "<widget ",
            '<widget xmlns:android="http://schemas.android.com/apk/res/android" ',
            1
        )

        if "<author" in xml:
            xml = re.sub(r"<author[^>]*>.*?</author>", '<author email="dev@magai.local">Mag Ai</author>', xml, flags=re.S)
        else:
            xml = xml.replace("</widget>", '  <author email="dev@magai.local">Mag Ai</author>\n</widget>', 1)

        extras = """
          <access origin="*" />
          <allow-navigation href="*" />
          <preference name="AndroidInsecureFileModeEnabled" value="true" />
          <preference name="android-minSdkVersion" value="21" />
          <preference name="KeepRunning" value="true" />
          <edit-config file="app/src/main/AndroidManifest.xml" mode="merge" target="/manifest/application">
            <application android:usesCleartextTraffic="true" android:hardwareAccelerated="true" android:icon="@mipmap/ic_launcher" />
          </edit-config>
        </widget>"""

        xml = xml.replace("</widget>", extras, 1)
        with open("config.xml", "w", encoding="utf-8") as f:
            f.write(xml)
        PYEOF

        python3 - << 'PYEOF'
        html = """<!DOCTYPE html>
        <html lang="ar" dir="rtl">
        <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1.0">
          <title>Mg Server — Mag Ai</title>
          <style>
            * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, Tahoma, sans-serif; }
            body { background: #0c0d12; color: #f4f5f8; padding: 18px; }
            .card { max-width: 720px; margin: 0 auto 16px; background: #161822; border: 1px solid rgba(255,255,255,0.08); border-radius: 16px; padding: 18px; }
            h1 { font-size: 1.25rem; margin-bottom: 6px; display: flex; align-items: center; gap: 10px; }
            .badge { font-size: 0.72rem; background: rgba(229,9,20,0.18); color: #ff6b72; padding: 2px 8px; border-radius: 99px; }
            .status-row { display: flex; align-items: center; gap: 8px; margin: 12px 0; font-size: 0.9rem; }
            .dot { width: 11px; height: 11px; border-radius: 50%; background: #ef4444; }
            .dot.online { background: #22c55e; }
            label { display: block; margin: 12px 0 6px; font-size: 0.88rem; color: #cbd0e0; }
            input, textarea { width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.12); background: #0f1118; color: #fff; font-size: 0.92rem; }
            .row2 { display: grid; grid-template-columns: 2fr 1fr; gap: 10px; }
            .btns { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; }
            button { padding: 10px 16px; border-radius: 11px; border: none; font-weight: 700; cursor: pointer; font-size: 0.9rem; }
            .btn-red { background: #e50914; color: #fff; }
            .btn-gray { background: #25293a; color: #fff; }
            .msg { margin-top: 10px; font-size: 0.85rem; color: #4ade80; min-height: 20px; }
            pre { background: #090a0f; border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; padding: 12px; font-size: 0.76rem; color: #a5b4fc; overflow-x: auto; max-height: 260px; white-space: pre-wrap; word-break: break-all; }
          </style>
        </head>
        <body>
          <div class="card">
            <h1>
              <img src="app-icon.png" onerror="this.style.display='none'" style="width:30px;height:30px;border-radius:8px;object-fit:contain;">
              <span>Mg Server</span>
              <span class="badge">Mag Ai</span>
            </h1>
            <p style="color:#9aa1b8;font-size:0.86rem;">إدارة إعدادات السيرفر وتوليد وتحديث ملف <strong>index.html</strong> تلقائياً لأي تعديل في الـ IP أو المنفذ أو كلمة المرور.</p>

            <div class="status-row">
              <span class="dot" id="liveDot"></span>
              <span id="liveText">جاري فحص حالة السيرفر...</span>
            </div>

            <div class="row2">
              <div>
                <label>عنوان الـ IP</label>
                <input type="text" id="ipInput" value="192.168.1.200" placeholder="192.168.1.200">
              </div>
              <div>
                <label>المنفذ (Port)</label>
                <input type="number" id="portInput" value="8080" placeholder="8080">
              </div>
            </div>

            <label>كلمة مرور السيرفر (اتركها فارغة لإلغاء القفل)</label>
            <input type="text" id="passInput" placeholder="مثال: 1 أو 1234 أو اتركه فارغاً">

            <label>روابط/ملفات الوسائط (سطر لكل عنصر بصيغة: الاسم | الرابط أو المسار | نوع: video أو audio أو folder)</label>
            <textarea id="itemsInput" rows="4">مجلد الأفلام | ?dir=Movies | folder
مقطع صوتي تجريبي | audio/sample.m4a | audio
مقطع فيديو تجريبي | video/sample.mp4 | video</textarea>

            <div class="btns">
              <button class="btn-red" onclick="applyAndSaveIndex()">حفظ وتحديث index.html</button>
              <button class="btn-gray" onclick="downloadIndexHtml()">تحميل index.html</button>
              <button class="btn-gray" onclick="checkServerStatus()">فحص الاتصال الآن</button>
            </div>
            <div class="msg" id="statusMsg"></div>
          </div>

          <div class="card">
            <label style="margin-top:0;">معاينة محتوى <strong>index.html</strong> المولّد تلقائياً:</label>
            <pre id="indexPreview"></pre>
          </div>

          <script>
            const ipEl = document.getElementById('ipInput');
            const portEl = document.getElementById('portInput');
            const passEl = document.getElementById('passInput');
            const itemsEl = document.getElementById('itemsInput');
            const previewEl = document.getElementById('indexPreview');
            const msgEl = document.getElementById('statusMsg');

            ipEl.value = localStorage.getItem('srv_ip') || '192.168.1.200';
            portEl.value = localStorage.getItem('srv_port') || '8080';
            passEl.value = localStorage.getItem('srv_pass') || '';
            itemsEl.value = localStorage.getItem('srv_items') || itemsEl.value;

            function escapeHtml(s) {
              return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
            }

            function buildGeneratedIndexHtml() {
              const ip = (ipEl.value || '192.168.1.200').trim();
              const port = (portEl.value || '8080').trim();
              const pass = passEl.value || '';
              const baseUrl = `http://${ip}:${port}`;

              const rows = itemsEl.value.split('\n').map(line => line.trim()).filter(Boolean).map(line => {
                const parts = line.split('|').map(p => p.trim());
                const title = parts[0] || 'عنصر';
                const target = parts[1] || '#';
                const kind = (parts[2] || 'video').toLowerCase();
                if (kind === 'folder') {
                  return `<a href="${escapeHtml(target)}" class="card">📁 ${escapeHtml(title)}</a>`;
                }
                if (kind === 'audio') {
                  return `<div class="card">🎵 <h3>${escapeHtml(title)}</h3><audio controls src="${escapeHtml(target)}"></audio></div>`;
                }
                return `<div class="card">🎬 <h3>${escapeHtml(title)}</h3><video controls src="${escapeHtml(target)}"></video></div>`;
              }).join('\n    ');

              const lockScript = pass ? `
                <div id="lockBox" style="position:fixed;inset:0;background:#0c0d12;display:flex;align-items:center;justify-content:center;z-index:99;">
                  <div style="background:#161822;padding:22px;border-radius:14px;text-align:center;width:280px;">
                    <h3>قفل السيرفر (${escapeHtml(baseUrl)})</h3>
                    <input id="pIn" type="password" placeholder="كلمة المرور" style="width:100%;padding:9px;margin:10px 0;border-radius:8px;border:1px solid #333;background:#0f1118;color:#fff;">
                    <button onclick="unlockSrv()" style="width:100%;padding:9px;border:none;border-radius:8px;background:#e50914;color:#fff;font-weight:700;">دخول</button>
                  </div>
                </div>
                <script>
                  function unlockSrv(){
                    if(document.getElementById('pIn').value === ${JSON.stringify(pass)}){
                      document.getElementById('lockBox').style.display='none';
                    } else { alert('كلمة المرور غير صحيحة'); }
                  }
                <\/script>` : '';

              return `<!DOCTYPE html>
        <html lang="ar" dir="rtl">
        <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1.0">
          <title>Mg Server (${escapeHtml(baseUrl)})</title>
          <style>
            body{font-family:Tahoma,sans-serif;background:#0f0f14;color:#fff;margin:0;padding:16px;}
            .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;}
            .card{display:block;background:#1a1c26;padding:12px;border-radius:12px;color:#fff;text-decoration:none;}
            video,audio{width:100%;margin-top:8px;border-radius:8px;}
          </style>
        </head>
        <body>
          ${lockScript}
          <h2>سيرفر الوسائط — ${escapeHtml(baseUrl)}</h2>
          <div class="grid">
            ${rows}
          </div>
        </body>
        </html>`;
            }

            function writeIndexFileToStorage(content) {
              localStorage.setItem('generated_index_html', content);
              if (window.requestFileSystem) {
                window.requestFileSystem(LocalFileSystem.PERSISTENT, 0, fs => {
                  fs.root.getDirectory('MgServer', { create: true }, dirEntry => {
                    dirEntry.getFile('index.html', { create: true }, fileEntry => {
                      fileEntry.createWriter(writer => {
                        writer.write(new Blob([content], { type: 'text/html' }));
                      });
                    });
                  });
                });
              }
            }

            function applyAndSaveIndex() {
              localStorage.setItem('srv_ip', ipEl.value.trim());
              localStorage.setItem('srv_port', portEl.value.trim());
              localStorage.setItem('srv_pass', passEl.value);
              localStorage.setItem('srv_items', itemsEl.value);

              const htmlOut = buildGeneratedIndexHtml();
              previewEl.textContent = htmlOut;
              writeIndexFileToStorage(htmlOut);
              msgEl.textContent = `تم التحديث وحفظ index.html (${ipEl.value.trim()}:${portEl.value.trim()})`;
              checkServerStatus();
            }

            function downloadIndexHtml() {
              const htmlOut = buildGeneratedIndexHtml();
              previewEl.textContent = htmlOut;
              const blob = new Blob([htmlOut], { type: 'text/html;charset=utf-8' });
              const url = URL.createObjectURL(blob);
              const a = document.createElement('a');
              a.href = url;
              a.download = 'index.html';
              a.click();
              URL.revokeObjectURL(url);
            }

            async function checkServerStatus() {
              const url = `http://${(ipEl.value || '192.168.1.200').trim()}:${(portEl.value || '8080').trim()}`;
              const dot = document.getElementById('liveDot');
              const txt = document.getElementById('liveText');
              dot.className = 'dot';
              txt.textContent = `جاري فحص ${url}...`;
              const ctrl = new AbortController();
              const t = setTimeout(() => ctrl.abort(), 1200);
              try {
                await fetch(`${url}/?check=${Date.now()}`, { mode: 'no-cors', signal: ctrl.signal });
                clearTimeout(t);
                dot.className = 'dot online';
                txt.textContent = `متصل ويعمل: ${url}`;
              } catch (_) {
                clearTimeout(t);
                dot.className = 'dot';
                txt.textContent = `غير متصل أو متوقف حالياً: ${url}`;
              }
            }

            [ipEl, portEl, passEl, itemsEl].forEach(el => {
              el.addEventListener('input', () => {
                previewEl.textContent = buildGeneratedIndexHtml();
              });
            });

            previewEl.textContent = buildGeneratedIndexHtml();
            checkServerStatus();
          </script>
        </body>
        </html>"""
        with open("www/index.html", "w", encoding="utf-8") as f:
            f.write(html)
        PYEOF

        cordova build android --debug

    - name: Upload Server APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: mg-server-apk
        path: mgServer/platforms/android/app/build/outputs/apk/debug/app-debug.apk
